---
# Deployment for the KubeDDoS controller (kopf-based operator).
# This single pod watches DDoSProtection and CrossfireMitigationIntent CRs
# across all namespaces and reconciles them into concrete Kubernetes resources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeddos-controller
  namespace: crossfire-system # kpt-set: ${system-namespace}
  labels:
    app.kubernetes.io/name: kubeddos-controller
    app.kubernetes.io/part-of: kubeddos
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeddos-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeddos-controller
        app.kubernetes.io/part-of: kubeddos
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kubeddos-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: controller
          image: kubeddos-controller:latest # kpt-set: ${controller-image}
          imagePullPolicy: IfNotPresent # kpt-set: ${image-pull-policy}
          command:
            - kopf
            - run
            - --all-namespaces
            - --liveness=http://0.0.0.0:8080/healthz
            - /app/nephio_controller.py
          ports:
            - name: healthz
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      restartPolicy: Always
