apiVersion: v1
kind: ConfigMap
metadata:
  name: ddos-dashboards
  namespace: istio-system
  labels:
    grafana_dashboard: "1"
data:
  ddos-overview.json: |
    {
      "dashboard": {
        "title": "DDoS Attack Overview",
        "tags": ["istio", "ddos"],
        "timezone": "browser",
        "panels": [
          {
            "title": "Request Rate by Service",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_service_namespace=\"sock-shop\"}[1m])) by (destination_service_name)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Error Rate",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_service_namespace=\"sock-shop\",response_code=~\"5..\"}[1m])) by (destination_service_name)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Response Time (P95)",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{destination_service_namespace=\"sock-shop\"}[1m])) by (destination_service_name, le))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Active Connections",
            "targets": [
              {
                "expr": "sum(envoy_cluster_upstream_cx_active{namespace=\"sock-shop\"}) by (cluster_name)"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crossfire-dashboard
  namespace: istio-system
  labels:
    grafana_dashboard: "1"
data:
  crossfire-attack.json: |
    {
      "dashboard": {
        "title": "Crossfire Attack Analysis",
        "tags": ["crossfire", "ddos", "security"],
        "timezone": "browser",
        "panels": [
          {
            "title": "Target Service Request Rate",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_service_name=\"front-end\",destination_service_namespace=\"sock-shop\"}[1m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Decoy Services Traffic",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_service_namespace=\"sock-shop\"}[1m])) by (destination_service_name)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Link Saturation (Network Bytes)",
            "targets": [
              {
                "expr": "sum(rate(istio_tcp_sent_bytes_total{destination_service_namespace=\"sock-shop\"}[1m])) + sum(rate(istio_tcp_received_bytes_total{destination_service_namespace=\"sock-shop\"}[1m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Circuit Breaker Status",
            "targets": [
              {
                "expr": "sum(envoy_cluster_circuit_breakers_default_rq_pending_open{namespace=\"sock-shop\"}) by (cluster_name)"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
