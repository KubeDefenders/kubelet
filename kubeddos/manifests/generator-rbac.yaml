---
# RBAC for IntentGenerator
# Permissions: watch DetectionEvent CRDs; create/update MitigationIntent CRDs.
# Does NOT need any access to workload resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossfire-intent-generator
  namespace: crossfire-system  # kpt-set: ${system-namespace}
  labels:
    app.kubernetes.io/component: intent-generator
    app.kubernetes.io/part-of: crossfire-nephio-refactor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossfire-intent-generator
  labels:
    app.kubernetes.io/component: intent-generator
    app.kubernetes.io/part-of: crossfire-nephio-refactor
rules:
  # Watch DetectionEvents (source)
  - apiGroups: ["crossfire.io"]
    resources: ["crossfiredetectionevents"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["crossfire.io"]
    resources: ["crossfiredetectionevents/status"]
    verbs: ["get", "patch", "update"]

  # Create and manage MitigationIntents (output)
  - apiGroups: ["crossfire.io"]
    resources: ["crossfiremitigationintents"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["crossfire.io"]
    resources: ["crossfiremitigationintents/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossfire-intent-generator
  labels:
    app.kubernetes.io/component: intent-generator
    app.kubernetes.io/part-of: crossfire-nephio-refactor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossfire-intent-generator
subjects:
  - kind: ServiceAccount
    name: crossfire-intent-generator
    namespace: crossfire-system  # kpt-set: ${system-namespace}
