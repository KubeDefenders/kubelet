apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeddos-frontend
  labels:
    app: kubeddos-frontend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeddos-frontend
  labels:
    app: kubeddos-frontend
rules:
  # Read CRDs (detection events + mitigation intents)
  - apiGroups: ["crossfire.io"]
    resources: ["crossfiredetectionevents", "crossfiremitigationintents"]
    verbs: ["get", "list", "watch"]
  # Read cluster state for dashboard
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeddos-frontend
  labels:
    app: kubeddos-frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeddos-frontend
subjects:
  - kind: ServiceAccount
    name: kubeddos-frontend
    namespace: default
