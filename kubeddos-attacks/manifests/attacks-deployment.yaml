apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeddos-attacks
  labels:
    app: kubeddos-attacks
    component: attack-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeddos-attacks
  template:
    metadata:
      labels:
        app: kubeddos-attacks
        component: attack-frontend
    spec:
      containers:
        - name: attacks
          image: kubeddos-attacks:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
              protocol: TCP
          env:
            - name: TARGET_URL
              valueFrom:
                configMapKeyRef:
                  name: kubeddos-attacks-config
                  key: target-url
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: kubeddos-attacks-config
                  key: prometheus-url
            - name: ATTACK_FRONTEND_PORT
              value: "5001"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeddos-attacks
  labels:
    app: kubeddos-attacks
spec:
  type: NodePort
  ports:
    - port: 5001
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: kubeddos-attacks
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeddos-attacks-config
  labels:
    app: kubeddos-attacks
data:
  target-url: "http://target-service:8080"
  prometheus-url: "http://prometheus-server.monitoring.svc.cluster.local:9090"
