<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KubeDDoS Attacks{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/attacks.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-lightning-charge-fill text-danger"></i> KubeDDoS Attacks
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/discovery' %}active{% endif %}" href="/discovery">
                            <i class="bi bi-search"></i> Discovery
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/strategies' %}active{% endif %}" href="/strategies">
                            <i class="bi bi-gear"></i> Strategies
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/execute' %}active{% endif %}" href="/execute">
                            <i class="bi bi-play-circle"></i> Execute
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/results' %}active{% endif %}" href="/results">
                            <i class="bi bi-clipboard-data"></i> Results
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/experiment' %}active{% endif %}" href="/experiment">
                            <i class="bi bi-play-btn"></i> Experiment
                        </a>
                    </li>
                </ul>
                <span class="navbar-text">
                    <span class="badge bg-secondary" id="active-attacks-badge">0 active</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-3">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.4/dist/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/attacks.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
