---
# Nephio-Enhanced HorizontalPodAutoscalers
# Translated from Nephio AutoScaling intents to K8s native HPAs
# Key difference from native K8s: Nephio labels, capacity annotations, SLO targets

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: front-end-hpa-nephio
  namespace: sock-shop
  labels:
    app: front-end
    nephio.org/managed: "true"
    nephio.org/intent: "AutoScaling"
    nephio.org/protection-level: "high"
  annotations:
    nephio.org/capacity-request: "5000 rps"
    nephio.org/slo-availability: "99.9"
    nephio.org/description: "Nephio-managed autoscaling with capacity intent"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: front-end
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

