apiVersion: v1
kind: ConfigMap
metadata:
  name: kptfile.kpt.dev
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  name: crossfire-protection-package
  # Package-wide configuration
  target-namespace: sock-shop
  cluster-name: edge-cluster-01
  protection-level: high
  
  # Capacity injection parameters (Nephio-specific)
  max-rps: "10000"
  max-connections: "5000"
  max-pods: "100"
  max-cpu: "40"
  max-memory: "64Gi"
  
  # Attack thresholds
  rate-limit-threshold: "500"
  connection-limit: "100"
  cpu-scale-threshold: "70"
  memory-scale-threshold: "80"
