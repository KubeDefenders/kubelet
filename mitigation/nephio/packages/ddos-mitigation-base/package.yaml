apiVersion: kpt.dev/v1
kind: Kptfile
metadata:
  name: ddos-mitigation-base
  annotations:
    config.kubernetes.io/local-config: "true"
info:
  description: Base DDoS mitigation package for Nephio deployment
  readinessGates:
  - conditionType: workload.nephio.org.Reconciled
  - conditionType: req.nephio.org.CapacityInjected
pipeline:
  mutators:
  - image: gcr.io/kpt-fn/apply-setters:v0.2.0
    configMap:
      namespace: sock-shop
      protection-level: high
  - image: gcr.io/kpt-fn/set-namespace:v0.4.1
    configMap:
      namespace: sock-shop
  validators:
  - image: gcr.io/kpt-fn/kubeval:v0.3.0
---
apiVersion: workload.nephio.org/v1alpha1
kind: DDoSProtection
metadata:
  name: sock-shop-ddos-protection
  namespace: sock-shop
  annotations:
    nephio.org/intent: "true"
    nephio.org/description: "DDoS protection for sock-shop microservices with Crossfire attack mitigation"
spec:
  intent:
    # High-level intent: Protect sock-shop from DDoS attacks
    targetNamespace: sock-shop
    protectionLevel: high             # Enum: low, medium, high, maximum
    
    # Attack types to protect against
    attackTypes:
    - http-flood
    - syn-flood
    - slowloris
    - dns-amplification
    - crossfire-app
    - crossfire-network
    
    # Capacity intent (Nephio calculates resources automatically)
    capacity:
      requestsPerSecond: 10000        # Total RPS capacity
      concurrentConnections: 5000     # Max concurrent connections
      bandwidth:
        downlink: 10Gbps
        uplink: 5Gbps
    
    # Service Level Objectives
    slo:
      availability: 99.9              # 3-nines availability
      latencyP50: 100ms
      latencyP95: 300ms
      latencyP99: 500ms
      errorRate: 0.1                  # Max 0.1% error rate
    
    # Service classification for Crossfire protection
    services:
    - name: front-end
      type: gateway
      criticality: high
      resources:
        cpu: "2"
        memory: 4Gi
    - name: catalogue
      type: decoy                     # Crossfire decoy service
      criticality: low
      resources:
        cpu: "1"
        memory: 2Gi
    - name: carts
      type: decoy
      criticality: low
      resources:
        cpu: "1"
        memory: 2Gi
    - name: user
      type: decoy
      criticality: low
      resources:
        cpu: "1"
        memory: 2Gi
    - name: payment
      type: critical                  # Critical business service
      criticality: maximum
      resources:
        cpu: "2"
        memory: 4Gi
    - name: orders
      type: critical
      criticality: maximum
      resources:
        cpu: "2"
        memory: 4Gi
    - name: shipping
      type: critical
      criticality: high
      resources:
        cpu: "1"
        memory: 2Gi
    
    # Mitigation strategies (Nephio auto-configures)
    mitigations:
      rateLimiting:
        enabled: true
        strategy: adaptive            # adaptive, fixed
        global: 1000                  # Global RPS limit
        perIP: 100                    # Per-IP RPS limit
      
      circuitBreaking:
        enabled: true
        consecutiveErrors: 5
        interval: 30s
        ejectionTime: 60s
      
      networkPolicies:
        enabled: true
        defaultDeny: true
        allowDNS: true
      
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 50
        targetCPU: 70
        targetMemory: 80
        scaleUpBehavior: aggressive   # aggressive, conservative
        scaleDownBehavior: conservative
      
      resourceQuotas:
        enabled: true
        cpuLimit: 20
        memoryLimit: 32Gi
        maxPods: 100
    
    # Advanced: Network function chaining
    networkFunctions:
    - name: attack-detector
      enabled: true
      placement: ingress
    - name: rate-limiter
      enabled: true
      placement: ingress
    - name: traffic-shaper
      enabled: true
      placement: service-mesh
  
  # Nephio auto-fills this status
  status:
    conditions: []
    capacityAllocated:
      cpu: ""
      memory: ""
      bandwidth: ""
---
apiVersion: req.nephio.org/v1alpha1
kind: CapacityRequest
metadata:
  name: sock-shop-capacity
  namespace: sock-shop
  annotations:
    nephio.org/intent: "true"
spec:
  # Request capacity for the DDoS protection
  for:
    group: workload.nephio.org
    kind: DDoSProtection
    name: sock-shop-ddos-protection
    namespace: sock-shop
  
  # Capacity requirements
  capacity:
    downlink: 10Gbps
    uplink: 5Gbps
    ipv4:
      count: 10                       # Public IPs needed
    ipv6:
      count: 10
  
  # Placement constraints
  placement:
    clusterSelector:
      matchLabels:
        nephio.org/region: us-west
        nephio.org/cluster-type: edge
---
# ResourceQuota applied by Nephio based on intent
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sock-shop-quota
  namespace: sock-shop
  annotations:
    nephio.org/generated: "true"
    nephio.org/source: DDoSProtection/sock-shop-ddos-protection
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 32Gi
    limits.cpu: "40"
    limits.memory: 64Gi
    persistentvolumeclaims: "10"
    pods: "100"
    services: "20"
---
# NetworkPolicy applied by Nephio
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: sock-shop
  annotations:
    nephio.org/generated: "true"
    nephio.org/source: DDoSProtection/sock-shop-ddos-protection
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# HPA configurations generated by Nephio based on capacity intent
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: front-end-hpa
  namespace: sock-shop
  annotations:
    nephio.org/generated: "true"
    nephio.org/source: DDoSProtection/sock-shop-ddos-protection
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: front-end
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      selectPolicy: Min
