---
# Circuit breaker for catalogue database
# Protect database from connection exhaustion
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: catalogue-db-circuit-breaker
  namespace: sock-shop
spec:
  host: catalogue-db.sock-shop.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 20           # Strict DB connection limit
        connectTimeout: 5s
        tcpKeepalive:
          time: 7200s
          interval: 75s
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 120s         # Longer ejection for DB
      maxEjectionPercent: 0          # Never evict DB (only 1 replica)
---
