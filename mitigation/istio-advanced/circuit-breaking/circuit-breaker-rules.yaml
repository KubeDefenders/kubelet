---
# Circuit breaker for front-end service
# Protects downstream services from overload
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: front-end-circuit-breaker
  namespace: sock-shop
spec:
  host: front-end.sock-shop.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100          # Max TCP connections
      http:
        http1MaxPendingRequests: 50  # Max requests waiting for connection
        http2MaxRequests: 100         # Max HTTP/2 requests
        maxRequestsPerConnection: 2   # Limit reuse
        maxRetries: 3                 # Max concurrent retries
    outlierDetection:
      consecutive5xxErrors: 5         # Evict after 5 errors
      interval: 30s                   # Check every 30s
      baseEjectionTime: 30s           # Evict for 30s minimum
      maxEjectionPercent: 50          # Max 50% of pods evicted
      minHealthPercent: 40            # Keep at least 40% healthy
---
# Circuit breaker for catalogue (decoy service)
# More lenient to absorb attacks
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: catalogue-circuit-breaker
  namespace: sock-shop
spec:
  host: catalogue.sock-shop.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200          # Higher limit for decoy
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
        maxRequestsPerConnection: 3
        maxRetries: 2                # Fewer retries
    outlierDetection:
      consecutive5xxErrors: 10       # More tolerant
      interval: 60s
      baseEjectionTime: 60s
      maxEjectionPercent: 70         # Can evict more
      minHealthPercent: 30
    loadBalancer:
      simple: LEAST_REQUEST          # Distribute load evenly
---
