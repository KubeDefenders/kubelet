---
# Circuit breaker for payment (critical service)
# Very strict to protect integrity
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: payment-circuit-breaker
  namespace: sock-shop
spec:
  host: payment.sock-shop.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50           # Strict limits
      http:
        http1MaxPendingRequests: 25
        http2MaxRequests: 50
        maxRequestsPerConnection: 1   # No connection reuse
        maxRetries: 1                 # Minimal retries
    outlierDetection:
      consecutive5xxErrors: 3         # Evict quickly
      interval: 20s                   # Check frequently
      baseEjectionTime: 60s           # Longer ejection
      maxEjectionPercent: 30          # Protect availability
      minHealthPercent: 70            # Keep most pods healthy
    loadBalancer:
      consistentHash:                 # Session affinity for payment
        httpCookie:
          name: payment-session
          ttl: 3600s
