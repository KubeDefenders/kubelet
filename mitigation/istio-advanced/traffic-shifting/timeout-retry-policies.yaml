---
# Anti-Crossfire: Traffic mirroring to analyze attack patterns
# Mirror catalogue traffic to monitoring service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: catalogue-mirror-vs
  namespace: sock-shop
spec:
  hosts:
  - catalogue.sock-shop.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: catalogue.sock-shop.svc.cluster.local
        port:
          number: 80
      weight: 100
    mirror:
      host: attack-monitor.sock-shop.svc.cluster.local  # Custom monitoring service
      port:
        number: 80
    mirrorPercentage:
      value: 10.0                   # Mirror 10% for analysis
    timeout: 5s
    retries:
      attempts: 1
      perTryTimeout: 2s
      retryOn: 5xx,reset
