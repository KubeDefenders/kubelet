---
# VirtualService for front-end with timeouts and retries
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: front-end-vs
  namespace: sock-shop
spec:
  hosts:
  - front-end.sock-shop.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: front-end.sock-shop.svc.cluster.local
        port:
          number: 8079
    timeout: 10s                    # Request timeout
    retries:
      attempts: 2                   # Retry twice
      perTryTimeout: 3s             # Timeout per retry
      retryOn: 5xx,reset,connect-failure,refused-stream
---
# VirtualService for catalogue (decoy) with aggressive timeouts
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: catalogue-vs
  namespace: sock-shop
spec:
  hosts:
  - catalogue.sock-shop.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: catalogue.sock-shop.svc.cluster.local
        port:
          number: 80
    timeout: 5s                     # Shorter timeout for decoy
    retries:
      attempts: 1                   # Fewer retries
      perTryTimeout: 2s
      retryOn: 5xx,reset
---
