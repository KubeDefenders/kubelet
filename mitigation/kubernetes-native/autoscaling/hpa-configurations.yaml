---
# HPA for front-end service
# Scales based on CPU and memory utilization
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: front-end-hpa
  namespace: sock-shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: front-end
  minReplicas: 2     # Always at least 2 for availability
  maxReplicas: 20    # Scale up to 20 during attacks
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Scale when CPU > 70%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Scale when memory > 80%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30   # Quick scale-up during attack
      policies:
      - type: Percent
        value: 100                      # Double pods quickly
        periodSeconds: 15
      - type: Pods
        value: 4                        # Or add 4 pods
        periodSeconds: 15
      selectPolicy: Max                 # Use most aggressive
    scaleDown:
      stabilizationWindowSeconds: 300  # Slow scale-down (5 min)
      policies:
      - type: Percent
        value: 50                       # Halve gradually
        periodSeconds: 60
---
# HPA for catalogue service (decoy target)
# More aggressive scaling to absorb attacks
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalogue-hpa
  namespace: sock-shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalogue
  minReplicas: 1
  maxReplicas: 30    # Higher max for decoy service
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60  # Scale earlier
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  # Custom metrics for requests/second (requires metrics-server)
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"  # Scale when > 1000 req/s per pod
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15   # Very quick scale-up
      policies:
      - type: Percent
        value: 200                      # Triple pods
        periodSeconds: 15
      - type: Pods
        value: 5                        # Or add 5 pods
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600  # Very slow scale-down
      policies:
      - type: Pods
        value: 1                        # Remove 1 pod at a time
        periodSeconds: 120
---
# HPA for cart service (decoy target)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart-hpa
  namespace: sock-shop
spec:
