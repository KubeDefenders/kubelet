  namespace: sock-shop
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: user-db
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: user-db
      minAllowed:
        cpu: 100m
        memory: 256Mi
      maxAllowed:
        cpu: 2
        memory: 4Gi
