---
# Catalogue API Rate Limiting (decoy service)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: catalogue-ratelimit
  namespace: sock-shop
spec:
  hosts:
  - "catalogue.sock-shop.svc.cluster.local"
  http:
  - match:
    - uri:
        prefix: /catalogue
    route:
    - destination:
        host: catalogue.sock-shop.svc.cluster.local

---
# Alternative: Kubernetes Ingress with NGINX Rate Limiting
# (If not using Istio gateway)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sock-shop-ingress-ratelimit
  namespace: sock-shop
  annotations:
    # NGINX rate limiting annotations
    nginx.ingress.kubernetes.io/limit-rps: "50"              # 50 req/s per IP
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"  # Allow burst to 100
    nginx.ingress.kubernetes.io/limit-connections: "10"      # Max 10 concurrent
    nginx.ingress.kubernetes.io/limit-rpm: "3000"            # 3000 req/min per IP
    # Connection timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
    # Request size limits
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
  - host: sock-shop.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: front-end
            port:
              number: 8079
