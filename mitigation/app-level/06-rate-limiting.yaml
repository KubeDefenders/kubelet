---
# Application-Level Mitigation: Rate Limiting at Gateway
# Limits requests per IP to prevent HTTP flood attacks

apiVersion: v1
kind: ConfigMap
metadata:
  name: rate-limit-config
  namespace: sock-shop
data:
  README: |
    Gateway Rate Limiting Configuration
    
    During Attack:
    - Attack source: 192.168.49.2 (single IP)
    - Attack rate: 94-102 req/s sustained
    - No rate limiting applied
    
    With Rate Limiting:
    - Allow 50 req/s per IP (bursts to 100)
    - Block attack traffic at gateway
    - Prevents flood from reaching services
    
    Result: 50% attack traffic blocked before hitting pods

---
# Istio EnvoyFilter - Global Rate Limiting
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: rate-limit-filter
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
            subFilter:
              name: "envoy.filters.http.router"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/udpa.type.v1.TypedStruct
          type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          value:
            stat_prefix: http_local_rate_limiter
            token_bucket:
              max_tokens: 100          # Burst size
              tokens_per_fill: 50      # 50 req/s sustained rate
              fill_interval: 1s
            filter_enabled:
              runtime_key: local_rate_limit_enabled
              default_value:
                numerator: 100
                denominator: HUNDRED
            filter_enforced:
              runtime_key: local_rate_limit_enforced
              default_value:
                numerator: 100
                denominator: HUNDRED
            response_headers_to_add:
            - append: false
              header:
                key: x-local-rate-limit
                value: 'true'

---
# Sock Shop Gateway with Rate Limiting
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: sock-shop-gateway-ratelimit
  namespace: sock-shop
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"

---
# VirtualService with Per-Route Rate Limiting

# Front-End with aggressive limits
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: front-end-ratelimit
  namespace: sock-shop
spec:
  hosts:
  - "*"
  gateways:
  - sock-shop-gateway-ratelimit
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: front-end.sock-shop.svc.cluster.local
        port:
          number: 8079
    # Per-route rate limit (requires Envoy config)
    # metadata:
    #   filter_metadata:
    #     envoy.filters.http.local_ratelimit:
    #       descriptors:
    #       - entries:
    #         - key: path
    #           value: "/"
